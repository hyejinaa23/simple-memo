<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>메모장</title>
<style>*{box-sizing:border-box}body{margin:24px auto;padding:0 16px;max-width:600px;background:white;color:#222;font:16px system-ui}section,article{border:1px solid #ddd;border-radius:8px;padding:16px;margin:16px 0}input,textarea,button{font:inherit;padding:10px;max-width:100%}input,textarea{display:block;width:100%;margin:8px 0;border:1px solid #aaa;border-radius:4px}button{cursor:pointer;margin:4px 4px 0 0}button:disabled{opacity:.5}article p{white-space:pre-wrap;overflow-wrap:anywhere}#status{min-height:24px;overflow-wrap:anywhere}[hidden]{display:none!important}</style>
<h1>메모장</h1>
<section id="auth"><form id="login"><label>이메일<input id="email" type="email" autocomplete="username" required></label><label>비밀번호<input id="password" type="password" autocomplete="current-password" minlength="6" required></label><button type="submit">로그인</button><button id="signup" type="button">회원가입</button></form></section>
<section id="app" hidden><button id="logout">로그아웃</button><form id="memo"><label>메모 내용<textarea id="content" rows="4" required></textarea></label><button type="submit">저장</button></form><div id="list"></div></section>
<p id="status" role="status" aria-live="polite"></p>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.js"></script>
<script>
const db=supabase.createClient('https://jfkoircvxbadvzuusmmo.supabase.co','sb_publishable_iOvEryZWC5TdiYYM5lPdbg_X4CM3lEg',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
const $=id=>document.getElementById(id);let user=null,busy=false,version=0,signupUntil=0;
function signupButton(){const seconds=Math.max(0,Math.ceil((signupUntil-Date.now())/1000));$('signup').disabled=busy||seconds>0;$('signup').textContent=seconds?'회원가입 ('+seconds+'초 후)':'회원가입'}
setInterval(signupButton,1000);
function friendly(e){const seconds=e.message?.match(/after (\d+) seconds/);if(seconds||e.status===429){signupUntil=Date.now()+Number(seconds?.[1]||60)*1000;return '가입 요청이 너무 잦습니다. '+Number(seconds?.[1]||60)+'초 후 다시 시도하세요.'}if(e.code==='email_not_confirmed')return '가입은 접수됐지만 이메일 확인이 아직 필요합니다. 받은 메일을 확인하세요.';if(e.code==='invalid_credentials')return '이메일 또는 비밀번호를 확인하세요.';return e.message}
function msg(t){$('status').textContent=t}
async function task(label,fn){if(busy)return;busy=true;document.querySelectorAll('button').forEach(b=>b.disabled=true);msg(label);try{msg(await fn()||'')}catch(e){msg('오류: '+friendly(e))}finally{busy=false;document.querySelectorAll('button').forEach(b=>b.disabled=false);signupButton()}}
async function list(){const current=++version;if(!user)return;const {data,error}=await db.from('memos').select('id,content,created_at').eq('user_id',user.id).order('created_at',{ascending:false});if(error)throw error;if(current!==version||!user)return;$('list').replaceChildren();if(!data.length){$('list').textContent='메모가 없습니다.';return}for(const m of data){const a=document.createElement('article'),p=document.createElement('p'),b=document.createElement('button');p.textContent=m.content;b.textContent='삭제';b.onclick=()=>task('삭제 중…',async()=>{const {error}=await db.from('memos').delete().eq('id',m.id).eq('user_id',user.id);if(error)throw error;await list()});a.append(p,b);$('list').append(a)}}
async function session(s){user=s?.user||null;version++;$('auth').hidden=!!user;$('app').hidden=!user;$('list').replaceChildren();$('password').value='';if(user)await list()}
$('login').onsubmit=e=>{e.preventDefault();task('로그인 중…',async()=>{const {data,error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)throw error;await session(data.session)})};
$('signup').onclick=()=>{if(!$('login').reportValidity())return;task('가입 중…',async()=>{const {data,error}=await db.auth.signUp({email:$('email').value.trim(),password:$('password').value});if(error)throw error;if(!data.session){signupUntil=Date.now()+60000;return '가입 요청이 접수됐습니다. 현재 이메일 확인이 켜져 있어 확인 메일을 열어야 로그인할 수 있습니다.'}await session(data.session)})};
$('logout').onclick=()=>task('로그아웃 중…',async()=>{const {error}=await db.auth.signOut();if(error)throw error;$('content').value='';await session(null)});
$('memo').onsubmit=e=>{e.preventDefault();task('저장 중…',async()=>{const content=$('content').value.trim();if(!content)throw Error('메모를 입력하세요.');const {error}=await db.from('memos').insert({user_id:user.id,content});if(error)throw error;$('content').value='';await list()})};
db.auth.onAuthStateChange((event,s)=>{if(event==='SIGNED_OUT'){user=null;version++;$('auth').hidden=false;$('app').hidden=true;$('list').replaceChildren()}});
task('불러오는 중…',async()=>{const {data,error}=await db.auth.getSession();if(error)throw error;await session(data.session)});
</script></html>
